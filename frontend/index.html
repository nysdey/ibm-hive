<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IBM Hive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/hive.css"/>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <div class="topnav-brand">
    <img src="/img/logo.svg" alt="IBM Hive" class="logo-img"/>
    IBM Hive
  </div>
  <div class="topnav-links">
    <div class="topnav-link active" data-view-link="org">Colonies</div>
    <div class="topnav-link" data-view-link="cell">My Team</div>
    <div class="topnav-link" data-view-link="network">My Combs</div>
  </div>
  <div class="topnav-search">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
      <circle cx="6.5" cy="6.5" r="5" stroke="#6f6f6f" stroke-width="1.5"/>
      <line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="text" placeholder="Search…" id="globalSearch"/>
  </div>
  <div class="topnav-user" id="topnavUser">
    <span id="currentUserName">Loading…</span>
    <div class="user-dropdown" id="userDropdown">
      <div class="user-dropdown-header">Switch view</div>
      <div class="user-dropdown-item active" data-profile="sydney">
        <div class="user-dropdown-avatar"></div>
        <div class="user-dropdown-info">
          <div class="user-dropdown-name">Sydney Chin</div>
          <div class="user-dropdown-role">BTSS Intern</div>
        </div>
      </div>
      <div class="user-dropdown-item" data-profile="manager">
        <div class="user-dropdown-avatar"></div>
        <div class="user-dropdown-info">
          <div class="user-dropdown-name">Chris Kennedy</div>
          <div class="user-dropdown-role">Manager</div>
        </div>
      </div>
      <div class="user-dropdown-item" data-profile="admin">
        <div class="user-dropdown-avatar"></div>
        <div class="user-dropdown-info">
          <div class="user-dropdown-name">Admin</div>
          <div class="user-dropdown-role">All access</div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="shell">

  <!-- MAIN CONTENT -->
  <main class="main" id="main">
    <div id="view-org"      class="view active"></div>
    <div id="view-cell"     class="view"></div>
    <div id="view-network"  class="view"></div>
  </main>

</div>

<!-- DETAIL SLIDE-OVER PANEL -->
<div class="panel-overlay" id="panelOverlay">
  <div class="detail-panel" id="detailPanel">
    <div class="dp-header">
      <div class="dp-avatar" id="dpAvatar"></div>
      <div style="flex:1;min-width:0">
        <div class="dp-name"   id="dpName">—</div>
        <div class="dp-role"   id="dpRole">—</div>
        <div class="dp-market" id="dpMarket">—</div>
      </div>
      <div class="dp-close" id="dpClose">✕</div>
    </div>
    <div class="dp-body">
      <div class="dp-section">
        <div class="dp-section-title">Contact</div>
        <div class="dp-row"><span class="dp-label">Email</span><a class="dp-link" id="dpEmail" href="#">—</a></div>
        <div class="dp-row"><span class="dp-label">Slack</span><span class="dp-value" id="dpSlack">—</span></div>
        <div class="dp-row"><span class="dp-label">Location</span><span class="dp-value" id="dpLocation">—</span></div>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">Relationship</div>
        <div class="dp-tag-row" id="dpTags"></div>
        <div class="dp-row" style="margin-top:8px">
          <span class="dp-label">How we met</span>
          <span class="dp-value" id="dpMet">—</span>
        </div>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">Notes</div>
        <div id="dpNotesList"></div>
        <form id="dpNoteForm" style="margin-top:10px;display:flex;gap:6px">
          <input id="dpNoteInput" type="text" placeholder="Add a note…"
            style="flex:1;padding:7px 10px;border:none;border-bottom:2px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-family:inherit;outline:none;border-radius:0"/>
          <button type="submit"
            style="padding:7px 14px;background:var(--ibm-blue-60);color:#fff;border:none;font-size:13px;cursor:pointer;font-family:inherit;">Add</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ADD / EDIT CONNECTION MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="connectionModal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add connection</div>
      <div class="modal-close" id="modalClose">✕</div>
    </div>
    <form id="connectionForm" class="modal-body">
      <label id="cfPersonRow">
        Person
        <select id="cfPerson"></select>
      </label>
      <label>
        Relationship
        <select id="cfRelationship">
          <option value="close_ally">Close ally</option>
          <option value="partner">Partner</option>
          <option value="cross_brand">Cross-brand</option>
          <option value="client">Client</option>
          <option value="peer">Peer</option>
        </select>
      </label>
      <label>
        How we met
        <input id="cfHowWeMet" type="text" placeholder="e.g. Partner summit 2023"/>
      </label>
      <label>
        Notes
        <textarea id="cfNotes" rows="3" placeholder="Context, why this relationship matters…"></textarea>
      </label>
      <label class="modal-checkbox">
        <input id="cfFollowup" type="checkbox"/> Needs follow-up
      </label>
      <div class="modal-actions">
        <button type="button" id="cfDelete" class="btn-danger" style="display:none">Delete</button>
        <div style="flex:1"></div>
        <button type="button" id="cfCancel" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
