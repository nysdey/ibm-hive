<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="beeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Left wing -->
  <ellipse cx="52" cy="115" rx="44" ry="26" transform="rotate(-15 52 115)"
    fill="url(#beeGrad)" opacity="0.75"/>

  <!-- Right wing -->
  <ellipse cx="148" cy="115" rx="44" ry="26" transform="rotate(15 148 115)"
    fill="url(#beeGrad)" opacity="0.75"/>

  <!-- Head -->
  <ellipse cx="100" cy="68" rx="32" ry="28" fill="url(#beeGrad)"/>

  <!-- Body segment 1 (gap) -->
  <rect x="68" y="90" width="64" height="8" rx="4" fill="#ffffff"/>

  <!-- Body segment 1 -->
  <rect x="65" y="98" width="70" height="18" rx="4" fill="url(#beeGrad)"/>

  <!-- Body segment 2 (gap) -->
  <rect x="68" y="116" width="64" height="7" rx="3" fill="#ffffff"/>

  <!-- Body segment 2 -->
  <rect x="65" y="123" width="70" height="18" rx="4" fill="url(#beeGrad)"/>

  <!-- Body segment 3 (gap) -->
  <rect x="70" y="141" width="60" height="6" rx="3" fill="#ffffff"/>

  <!-- Body segment 3 -->
  <rect x="68" y="147" width="64" height="16" rx="4" fill="url(#beeGrad)"/>

  <!-- Stinger -->
  <ellipse cx="100" cy="172" rx="22" ry="11" fill="url(#beeGrad)"/>

  <!-- Left antenna -->
  <path d="M88 48 Q72 26 62 18" stroke="url(#beeGrad)" stroke-width="5"
    stroke-linecap="round" fill="none"/>
  <circle cx="60" cy="16" r="6" fill="url(#beeGrad)"/>

  <!-- Right antenna -->
  <path d="M112 48 Q128 26 138 18" stroke="url(#beeGrad)" stroke-width="5"
    stroke-linecap="round" fill="none"/>
  <circle cx="140" cy="16" r="6" fill="url(#beeGrad)"/>
</svg>
